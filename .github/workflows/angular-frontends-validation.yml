name: Angular frontend validation

on:
  push:
    branches: [main]
    paths:
      - 'demo-ng/**'
      - 'catalogo-front/**'
      - '.github/workflows/angular-frontends-validation.yml'
      - '.github/dependabot.yml'
  pull_request:
    paths:
      - 'demo-ng/**'
      - 'catalogo-front/**'
      - '.github/workflows/angular-frontends-validation.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: npm ci and build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [demo-ng, catalogo-front]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
